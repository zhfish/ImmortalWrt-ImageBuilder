name: Build 25.12.x x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 ImmortalWrt 版本"
        required: true
        default: "25.12.2"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      custom_router_ip:
        description: "LAN 管理地址，格式: 192.168.x.1 或 10.x.x.1"
        required: true
        default: "10.214.37.1"
      enable_store:
        description: "集成 iStore 商店"
        required: false
        type: boolean
        default: false
      build_installer_iso:
        description: "额外制作 ISO 安装器（启动后输入 ddd 写入硬盘，约多 5 分钟）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一版本同时只跑一个构建，避免互相覆盖 Release
concurrency:
  group: ${{ github.workflow }}-${{ inputs.luci_version }}

env:
  LUCI_VERSION: ${{ inputs.luci_version }}
  RELEASE_TAG: x86-64-${{ inputs.luci_version }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate inputs
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
        run: |
          valid=true
          if [[ "$CUSTOM_ROUTER_IP" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            for octet in "${BASH_REMATCH[@]:1}"; do
              [ "$octet" -le 255 ] || valid=false
            done
          else
            valid=false
          fi
          if [ "$valid" != true ]; then
            echo "::error::管理地址格式不正确: $CUSTOM_ROUTER_IP"
            exit 1
          fi

      - name: Enable Store integration
        if: inputs.enable_store
        run: |
          echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
          echo "✅ 已追加 luci-app-store"

      - name: Build ImmortalWrt x86-64
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
        run: |
          mkdir -p bin
          # -e VAR 不写值时，docker 直接从当前环境取值
          docker run --rm -i --user root \
            -v "$GITHUB_WORKSPACE/bin:/home/build/immortalwrt/bin" \
            -v "$GITHUB_WORKSPACE/files:/home/build/immortalwrt/files" \
            -v "$GITHUB_WORKSPACE/shell:/home/build/immortalwrt/shell" \
            -v "$GITHUB_WORKSPACE/x86-64/config.override:/home/build/immortalwrt/config.override" \
            -v "$GITHUB_WORKSPACE/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e CUSTOM_ROUTER_IP \
            "immortalwrt/imagebuilder:x86-64-openwrt-${LUCI_VERSION}" \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: Create release notes
        env:
          CUSTOM_ROUTER_IP: ${{ inputs.custom_router_ip }}
          ENABLE_STORE: ${{ inputs.enable_store && '是' || '否' }}
          BUILD_INSTALLER_ISO: ${{ inputs.build_installer_iso }}
        run: |
          {
            echo "## 📡 ImmortalWrt ${LUCI_VERSION} x86-64"
            echo
            echo "- 🕒 构建时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京时间）"
            echo "- 🏠 管理地址: \`${CUSTOM_ROUTER_IP}\`（LAN 口 eth0；eth1 为 WAN，DHCP 获取地址）"
            echo "- 👤 用户名: \`root\`  🔑 密码: 无"
            echo "- 💾 软件包空间: 4G"
            echo "- 🐳 Docker: 已集成　🛒 iStore: ${ENABLE_STORE}"
            echo
            echo "### 文件说明"
            echo
            echo "| 文件 | 用途 |"
            echo "| --- | --- |"
            echo "| \`*-squashfs-combined-efi.img.gz\` | 写入硬盘或导入虚拟机，UEFI 和传统 BIOS 都能启动 |"
            echo "| \`*-image-efi.iso\` | Live ISO：直接从 U 盘或虚拟机光驱启动运行，不写硬盘，重启后配置不保留 |"
            if [ "$BUILD_INSTALLER_ISO" = "true" ]; then
              echo "| \`*-installer.iso\` | 安装器 ISO：启动后输入 \`ddd\`，按提示把系统写入硬盘 |"
            fi
            echo
            echo "<details><summary>集成的软件包（$(wc -l < bin/packages.txt) 个）</summary>"
            echo
            echo '```'
            cat bin/packages.txt
            echo '```'
            echo
            echo "</details>"
          } > release-notes.md
          cat release-notes.md

      # 每个版本只保留最新一次构建：删掉旧的 Release 和 tag 后重新创建
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ImmortalWrt ${LUCI_VERSION} x86-64" \
            --notes-file release-notes.md \
            bin/targets/x86/64/*squashfs-combined-efi.img.gz \
            bin/targets/x86/64/*.iso

      - name: Upload firmware for installer ISO
        if: inputs.build_installer_iso
        uses: actions/upload-artifact@v6
        with:
          name: firmware-img
          path: bin/targets/x86/64/*squashfs-combined-efi.img.gz
          retention-days: 1

  installer_iso:
    if: inputs.build_installer_iso
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img

      # ISO 安装器由 wukongdaily/img-installer 项目制作
      - name: Build installer ISO
        run: |
          git clone --depth=1 https://github.com/wukongdaily/img-installer.git
          chmod +x img-installer/custom.sh img-installer/supportFiles/custom/build.sh
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: Upload installer ISO to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          iso="immortalwrt-${LUCI_VERSION}-x86-64-installer.iso"
          mv img-installer/output/custom-installer-x86_64.iso "$iso"
          gh release upload "$RELEASE_TAG" "$iso" --repo "$GITHUB_REPOSITORY" --clobber
