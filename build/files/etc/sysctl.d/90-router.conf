# 路由器内核参数（在 ImmortalWrt 默认值基础上调整，修改后执行 `sysctl -p /etc/sysctl.d/90-router.conf` 生效）
# 注意：不修改 arp_ignore（官方默认 1，macvlan shim 依赖它）和 rp_filter

# BBR 拥塞控制：只影响路由器本机收发的 TCP（包括容器），不影响转发流量
net.ipv4.tcp_congestion_control=bbr
# 队列规则保持 fq_codel（BBR 自带发包节奏控制，不需要 fq）
net.core.default_qdisc=fq_codel

# 连接跟踪表上限，适合大量设备和 P2P 下载
net.netfilter.nf_conntrack_max=262144

# 网卡收包积压与每轮处理量，适合 2.5G 网口
net.core.netdev_max_backlog=16384
net.core.netdev_budget=600

# 套接字缓冲区上限（16 MiB）
net.core.rmem_max=16777216
net.core.wmem_max=16777216
# TCP 缓冲区：最小 / 默认 / 最大
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 16384 16777216

# TCP Fast Open（客户端和服务端都启用）
net.ipv4.tcp_fastopen=3
# 遇到 MTU 黑洞时自动探测（PPPoE 的 MTU 只有 1492）
net.ipv4.tcp_mtu_probing=1
# 长连接空闲后不重新慢启动
net.ipv4.tcp_slow_start_after_idle=0

# 邻居表（ARP）上限，适合局域网设备较多的情况
net.ipv4.neigh.default.gc_thresh1=1024
net.ipv4.neigh.default.gc_thresh2=4096
net.ipv4.neigh.default.gc_thresh3=8192

# inotify 上限（容器、文件同步类应用需要）
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512

# macvlan shim 只回应路由经过 shim 的 ARP 请求（即 macvlan 容器），
# 局域网其他设备看到的 LAN 地址 MAC 不会来回变化。
# 设备在开机后才创建，由 /etc/hotplug.d/net/00-sysctl 在设备出现时应用
net.ipv4.conf.macvlan-shim.arp_filter=1
